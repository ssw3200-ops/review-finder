name: 체험단 수집

on:
  schedule:
    - cron: "7 1,7 * * *"   # KST 10:07, 16:07
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["crawler/**", "requirements.txt", ".github/workflows/crawl.yml"]

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m crawler.crawl
      - name: 변경분 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/campaigns.json docs/data/debug.json
          git diff --cached --quiet || git commit -m "data: 체험단 공고 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase -q origin main || true
          git push

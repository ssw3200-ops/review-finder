<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>체험단 모아보기 — 블로그·인스타·릴스 체험단 한 번에</title>
<meta name="description" content="여러 체험단 사이트 공고를 매체(블로그·인스타·릴스)와 지역으로 골라, 경쟁률 낮은 순으로 한 번에 찾아보세요.">
<meta property="og:title" content="체험단 모아보기">
<meta property="og:description" content="블로그 1개, 릴스 1개로 신청하는 체험단을 경쟁률 낮은 순으로">
<style>
:root{--bg:#f6f6f4;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e6e6e3;--accent:#ff5a36;--accent-soft:#fff0eb;
--blog:#03a94d;--insta:#c13584;--reels:#7b3fe4;--clip:#00a3d9;--youtube:#e62117;--good:#0a8f4f;--mid:#c98a00;--hard:#d33b2c}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;-webkit-text-size-adjust:100%}
header{padding:20px 16px 8px;max-width:720px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.4px}
h1 span{color:var(--accent)}
.lead{margin:0;color:var(--sub);font-size:14px;line-height:1.5}
.bar{position:sticky;top:0;z-index:5;background:rgba(246,246,244,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:720px;margin:0 auto;padding:10px 16px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;min-height:38px}
.chip.sm{padding:6px 12px;font-size:13px;min-height:34px;font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.row{display:flex;gap:8px}
select,input[type=search]{flex:1;min-width:0;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;font-size:15px;color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin:4px 2px 10px}
.list{display:grid;gap:10px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit;transition:transform .08s}
.card:active{transform:scale(.99)}
.top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.badge{font-weight:700;font-size:12px;padding:3px 8px;border-radius:6px;color:#fff}
.m-blog{background:var(--blog)}.m-insta{background:var(--insta)}.m-reels{background:var(--reels)}.m-clip{background:var(--clip)}.m-youtube{background:var(--youtube)}
.tag{padding:3px 8px;border-radius:6px;background:#f0f0ee;color:#44444a;font-weight:600}
.tag.extra{background:#fff4d6;color:#8a5a00}
.site{margin-left:auto}
.title{font-size:16px;font-weight:700;margin:8px 0 4px;line-height:1.35;letter-spacing:-.2px}
.offer{font-size:13px;color:var(--sub);margin:0 0 10px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.foot{display:flex;align-items:center;gap:10px;font-size:13px}
.ratio{font-weight:800;font-size:15px}
.ratio.good{color:var(--good)}.ratio.mid{color:var(--mid)}.ratio.hard{color:var(--hard)}
.cnt{color:var(--sub)}
.dday{margin-left:auto;font-weight:700}
.dday.soon{color:var(--accent)}
.empty{text-align:center;color:var(--sub);padding:48px 0;font-size:15px}
.more{display:block;width:100%;margin-top:12px;height:46px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
footer{max-width:720px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--sub);line-height:1.6}
footer a{color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>체험단 <span>모아보기</span></h1>
  <p class="lead">여러 체험단 사이트 공고를 한곳에서. 매체와 지역을 고르고 <b>경쟁률 낮은 순</b>으로 찾아보세요.</p>
</header>

<div class="bar"><div class="bar-in">
  <div class="chips" id="media" role="group" aria-label="매체">
    <button class="chip" data-v="" aria-pressed="true">전체</button>
    <button class="chip" data-v="blog" aria-pressed="false">블로그</button>
    <button class="chip" data-v="insta" aria-pressed="false">인스타</button>
    <button class="chip" data-v="reels" aria-pressed="false">릴스</button>
    <button class="chip" data-v="clip" aria-pressed="false">클립</button>
  </div>
  <div class="chips" id="cat" role="group" aria-label="분야">
    <button class="chip sm" data-v="" aria-pressed="true">전체 분야</button>
    <button class="chip sm" data-v="맛집" aria-pressed="false">🍽 맛집</button>
    <button class="chip sm" data-v="뷰티" aria-pressed="false">💅 뷰티</button>
    <button class="chip sm" data-v="숙박" aria-pressed="false">🏨 숙박</button>
    <button class="chip sm" data-v="문화" aria-pressed="false">🎨 문화</button>
    <button class="chip sm" data-v="배달" aria-pressed="false">🛵 배달</button>
    <button class="chip sm" data-v="포장" aria-pressed="false">🥡 포장</button>
    <button class="chip sm" data-v="제품" aria-pressed="false">📦 제품</button>
    <button class="chip sm" data-v="기타" aria-pressed="false">기타</button>
  </div>
  <div class="row">
    <select id="sido" aria-label="지역"><option value="">전체 지역</option></select>
    <select id="type" aria-label="유형">
      <option value="">방문+배송</option><option value="방문">방문</option><option value="배송">배송</option><option value="기자단">기자단</option>
    </select>
    <select id="sort" aria-label="정렬">
      <option value="ratio">경쟁률순</option><option value="deadline">마감순</option><option value="applied">신청 적은순</option>
    </select>
  </div>
  <div class="row">
    <input type="search" id="q" placeholder="업체명·메뉴·동네 검색" aria-label="검색">
  </div>
  <label class="toggle"><input type="checkbox" id="single"> 리뷰 1개만 (영수증·스토어 리뷰 등 추가 미션 제외)</label>
</div></div>

<main>
  <div class="meta"><span id="count">불러오는 중…</span><span id="updated"></span></div>
  <div class="list" id="list"></div>
  <button class="more" id="more" hidden>더 보기</button>
</main>

<footer>
  <p>공고 정보는 각 체험단 사이트 공개 목록에서 하루 3번 모아옵니다. 신청·선정은 각 사이트에서 진행되며, 실제 모집 내용과 마감은 원 공고에서 꼭 확인하세요.</p>
  <p id="sources"></p>
  <p>만든 곳: 블로그 「아이랑 오늘 뭐하지?」</p>
</footer>

<script>
(() => {
  const SIDO = ["서울","경기","인천","강원","대전","세종","충북","충남","광주","전북","전남","대구","경북","경남","부산","울산","제주","배송·전국","기타"];
  const MEDIA = {blog:"블로그",insta:"인스타",reels:"릴스",clip:"클립",youtube:"유튜브"};
  const PAGE = 30;
  const $ = id => document.getElementById(id);
  const state = {cat:"", media:"", sido:"", type:"", sort:"ratio", q:"", single:false, shown:PAGE};
  let all = [];

  const store = {
    get(){ try { return JSON.parse(localStorage.getItem("rf-filter") || "{}"); } catch { return {}; } },
    set(v){ try { localStorage.setItem("rf-filter", JSON.stringify(v)); } catch {} }
  };

  SIDO.forEach(s => $("sido").insertAdjacentHTML("beforeend", `<option value="${s}">${s}</option>`));

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const today = new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Seoul"})); today.setHours(0,0,0,0);
  const dday = d => { if(!d) return null; return Math.round((new Date(d+"T00:00:00") - today)/864e5); };

  function filtered(){
    const q = state.q.trim().toLowerCase();
    let r = all.filter(i =>
      (!state.media || i.media === state.media) &&
      (!state.cat || i.cat === state.cat) &&
      (!state.sido || i.sido === state.sido) &&
      (!state.type || i.type === state.type) &&
      (!state.single || !i.extra_mission) &&
      (!q || `${i.title} ${i.offer} ${i.area} ${i.sido}`.toLowerCase().includes(q)) &&
      (dday(i.deadline) === null || dday(i.deadline) >= 0)
    );
    const big = 1e9;
    const key = {
      ratio: i => i.ratio ?? big,
      deadline: i => i.deadline ? dday(i.deadline) : big,
      applied: i => i.applied ?? big
    }[state.sort];
    return r.sort((a,b) => key(a) - key(b) || (a.ratio ?? big) - (b.ratio ?? big));
  }

  function card(i){
    const d = dday(i.deadline);
    const dTxt = d === null ? "" : d === 0 ? "오늘 마감" : `D-${d}`;
    const ratio = i.ratio;
    const rCls = ratio === null || ratio === undefined ? "" : ratio <= 2 ? "good" : ratio <= 6 ? "mid" : "hard";
    const rTxt = ratio === null || ratio === undefined ? "" : (ratio < 1 ? "미달" : `${ratio}:1`);
    const where = i.sido === "배송·전국" ? "배송" : [i.sido, i.area].filter(Boolean).join(" ");
    return `<a class="card" href="${esc(i.url)}" target="_blank" rel="noopener nofollow">
      <div class="top">
        <span class="badge m-${esc(i.media)}">${esc(MEDIA[i.media] || i.media)}</span>
        ${i.cat ? `<span class="tag">${esc(i.cat)}</span>` : ""}
        ${where ? `<span class="tag">${esc(where)}</span>` : ""}
        ${i.extra_mission ? `<span class="tag extra">추가 미션</span>` : ""}
        <span class="site">${esc(i.site)}</span>
      </div>
      <p class="title">${esc(i.title)}</p>
      ${i.offer ? `<p class="offer">${esc(i.offer)}</p>` : ""}
      <div class="foot">
        ${rTxt ? `<span class="ratio ${rCls}">${rTxt}</span>` : ""}
        ${i.recruit ? `<span class="cnt">신청 ${i.applied ?? "?"} / 모집 ${i.recruit}</span>` : ""}
        ${dTxt ? `<span class="dday ${d <= 1 ? "soon" : ""}">${dTxt}</span>` : ""}
      </div></a>`;
  }

  function render(){
    const r = filtered();
    $("count").textContent = `${r.length.toLocaleString()}개 공고`;
    $("list").innerHTML = r.length ? r.slice(0, state.shown).map(card).join("")
      : `<div class="empty">조건에 맞는 공고가 없어요.<br>지역이나 매체를 넓혀 보세요.</div>`;
    $("more").hidden = r.length <= state.shown;
    store.set({cat:state.cat, media:state.media, sido:state.sido, type:state.type, sort:state.sort, single:state.single});
  }

  function sync(){
    document.querySelectorAll("#media .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.media));
    document.querySelectorAll("#cat .chip").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.cat));
    $("sido").value = state.sido; $("type").value = state.type; $("sort").value = state.sort; $("single").checked = state.single;
  }

  $("media").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.media = b.dataset.v; state.shown = PAGE; sync(); render();
  });
  $("cat").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.cat = b.dataset.v; state.shown = PAGE; sync(); render();
  });
  ["sido","type","sort"].forEach(id => $(id).addEventListener("change", e => { state[id] = e.target.value; state.shown = PAGE; render(); }));
  $("single").addEventListener("change", e => { state.single = e.target.checked; state.shown = PAGE; render(); });
  let t; $("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; state.shown = PAGE; render(); }, 150); });
  $("more").addEventListener("click", () => { state.shown += PAGE; render(); });

  Object.assign(state, store.get()); sync();

  const load = f => fetch(f, {cache:"no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null);
  Promise.all([load("data/campaigns.json"), load("data/local.json")]).then(([main, local]) => {
    if (!main && !local) { $("count").textContent = "데이터를 불러오지 못했어요. 잠시 후 다시 시도해 주세요."; return; }
    const seen = new Set(); all = [];
    [main, local].forEach(d => (d?.items || []).forEach(i => { if (!seen.has(i.id)) { seen.add(i.id); all.push(i); } }));
    const ups = [main?.updated, local?.updated].filter(Boolean).sort();
    $("updated").textContent = ups.length ? `${ups[ups.length-1]} 업데이트` : "";
    const sites = {...(main?.sites || {}), ...(local?.sites || {})};
    $("sources").textContent = "수집 사이트: " + Object.entries(sites).map(([k,v]) => `${k} ${v.count}건`).join(" · ");
    render();
  });
})();
</script>
</body>
</html>
